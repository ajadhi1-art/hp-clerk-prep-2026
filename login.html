<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HP Clerk Prep 2026 — Student Account</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#102a43;color:#fff;padding:15px}.nav{max-width:1000px;margin:auto;display:flex;justify-content:space-between}.logo{font-weight:900}.logo span{color:#ffd166}.nav a{color:#fff;text-decoration:none;margin-left:14px;font-weight:700}main{max-width:1000px;margin:25px auto;padding:0 17px}.box{max-width:500px;margin:auto;background:#fff;border:1px solid #dce5ec;border-radius:16px;padding:25px;box-shadow:0 6px 22px #1720330b}.tabs{display:flex;margin-bottom:18px}.tab{flex:1;padding:12px;border:0;font-weight:900;cursor:pointer}.active{background:#176b87;color:#fff}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #cdd8e1;border-radius:8px;font:inherit}.btn{width:100%;padding:12px;border:0;border-radius:8px;background:#176b87;color:#fff;font-weight:900;cursor:pointer}.muted{color:#64748b;line-height:1.5}.error{color:#a62c2c;font-weight:700}.success{color:#176b87;font-weight:700}.hidden{display:none}.profile{max-width:850px;margin:auto}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;padding:18px;border:1px solid #dce5ec;border-radius:13px}.card strong{font-size:28px;color:#176b87;display:block}@media(max-width:600px){.cards{grid-template-columns:1fr}.nav a{display:none}}</style></head><body>
<header><div class="nav"><div class="logo">HP Clerk <span>Prep 2026</span></div><div><a href="index.html">Home</a><a href="exam-simulator.html">100Q Exam</a><a href="dashboard.html">Dashboard</a></div></div></header>
<main><div id="auth" class="box"><h1>👨‍🎓 Student Account</h1><p class="muted">Create a local student profile to personalize this prototype. This version intentionally does not send passwords to a server.</p><div class="tabs"><button class="tab active" onclick="mode('login',this)">LOGIN</button><button class="tab" onclick="mode('register',this)">REGISTER</button></div>
<div id="login"><div class="field"><label>Email</label><input id="le" type="email"></div><div class="field"><label>Password</label><input id="lp" type="password"></div><button class="btn" onclick="doLogin()">LOGIN</button></div>
<div id="register" class="hidden"><div class="field"><label>Full Name</label><input id="rn"></div><div class="field"><label>Email</label><input id="re" type="email"></div><div class="field"><label>Password</label><input id="rp" type="password"></div><button class="btn" onclick="doRegister()">CREATE ACCOUNT</button></div><p id="msg"></p></div>
<div id="profile" class="profile hidden"><div class="box"><h1>Welcome, <span id="name"></span> 👋</h1><p class="muted" id="email"></p><button class="btn" onclick="logout()">LOG OUT</button></div><div class="cards" style="margin-top:15px"><div class="card"><strong id="tests">0</strong>Tests</div><div class="card"><strong id="best">0%</strong>Best Score</div><div class="card"><strong id="points">0</strong>Prep Points</div></div></div></main>
<script>
const UKEY="hpclerk_users_v1",SKEY="hpclerk_session_v1";
function users(){return JSON.parse(localStorage.getItem(UKEY)||"[]")}function save(x){localStorage.setItem(UKEY,JSON.stringify(x))}
function mode(m,b){document.getElementById("login").classList.toggle("hidden",m!=="login");document.getElementById("register").classList.toggle("hidden",m!=="register");document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");msg.textContent=""}
function doRegister(){let n=rn.value.trim(),e=re.value.trim().toLowerCase(),p=rp.value;if(!n||!e||p.length<6){msg.className="error";msg.textContent="Enter your name, valid email and a password of at least 6 characters.";return}let a=users();if(a.some(x=>x.email===e)){msg.className="error";msg.textContent="An account with this email already exists.";return}let u={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name:n,email:e,password:p,created:new Date().toISOString()};a.push(u);save(a);localStorage.setItem(SKEY,u.id);show(u);msg.className="success";msg.textContent="Account created successfully."}
function doLogin(){let e=le.value.trim().toLowerCase(),p=lp.value,a=users(),u=a.find(x=>x.email===e&&x.password===p);if(!u){msg.className="error";msg.textContent="Email or password is incorrect.";return}localStorage.setItem(SKEY,u.id);show(u)}
function show(u){document.getElementById("auth").classList.add("hidden");document.getElementById("profile").classList.remove("hidden");name.textContent=u.name;email.textContent=u.email;let r=JSON.parse(localStorage.getItem("hpclerk_results_v1")||"[]"),best=r.length?Math.max(...r.map(x=>+x.score||0)):0;tests.textContent=r.length;document.getElementById("best").textContent=best+"%";points.textContent=r.reduce((n,x)=>n+(+x.score||0),0)}
function logout(){localStorage.removeItem(SKEY);location.reload()}
let sid=localStorage.getItem(SKEY);if(sid){let u=users().find(x=>x.id===sid);if(u)show(u)}
</script></body></html>
