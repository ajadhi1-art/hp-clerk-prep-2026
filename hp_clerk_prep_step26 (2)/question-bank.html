<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HP Clerk Prep — Question Bank</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#102a43;color:#fff;padding:15px 20px}.nav{max-width:1100px;margin:auto;display:flex;justify-content:space-between}.logo{font-size:22px;font-weight:800}.logo span{color:#ffd166}main{max-width:1100px;margin:28px auto;padding:0 18px}.hero,.card{background:#fff;border:1px solid #e1e7ee;border-radius:15px;padding:22px}.hero{background:linear-gradient(135deg,#176b87,#102a43);color:#fff}.hero p{color:#dce8ef}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.filters input,.filters select{padding:11px;border:1px solid #d4dee7;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.tag{display:inline-block;background:#eef7fa;color:#176b87;border-radius:15px;padding:4px 8px;font-size:12px;font-weight:700;margin-right:5px}.muted{color:#64748b}.btn{display:inline-block;background:#176b87;color:#fff;padding:11px 15px;border-radius:9px;text-decoration:none;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head>
<body><header><div class="nav"><div class="logo">HP Clerk <span>Prep 2026</span></div><div>Question Bank</div><a href="login.html">Student Login</a></div></header><main>
<section class="hero"><h1>📚 Structured Question Bank</h1><p>Practice across the major subjects used by the HP Clerk preparation platform. The current starter bank contains 50 curated practice questions.</p><a class="btn" href="mock-test.html">START MOCK TEST →</a></section>
<div class="filters"><input id="search" placeholder="Search questions..." oninput="render()"><select id="subject" onchange="render()"><option>All Subjects</option></select><select id="difficulty" onchange="render()"><option>All Difficulties</option><option>Easy</option><option>Moderate</option><option>Hard</option></select></div>
<div id="stats" class="muted"></div><div id="list" class="grid" style="margin-top:14px"></div>
</main><script>
let bank=[];fetch("questions.json").then(r=>r.json()).then(x=>{bank=x;let s=[...new Set(bank.map(q=>q.subject))].sort();document.getElementById("subject").innerHTML='<option>All Subjects</option>'+s.map(x=>`<option>${esc(x)}</option>`).join("");render()});
function render(){let term=(document.getElementById("search").value||"").toLowerCase(),s=document.getElementById("subject").value,d=document.getElementById("difficulty").value;let a=bank.filter(q=>(s==="All Subjects"||q.subject===s)&&(d==="All Difficulties"||q.difficulty===d)&&((q.question+" "+q.answer+" "+q.subject).toLowerCase().includes(term)));document.getElementById("stats").textContent=`Showing ${a.length} of ${bank.length} questions`;document.getElementById("list").innerHTML=a.map((q,i)=>`<div class="card"><span class="tag">${esc(q.subject)}</span><span class="tag">${esc(q.difficulty)}</span><h3>${i+1}. ${esc(q.question)}</h3><p class="muted">Answer: <b>${esc(q.answer)}</b></p><p>${esc(q.explanation||"")}</p></div>`).join("")||'<div class="card">No matching questions.</div>'}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
</script></body></html>
